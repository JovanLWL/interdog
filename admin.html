<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interdog | Ultimate Admin</title>
  <style>
    :root { --primary: #1A2A3A; --gold: #C5A059; --bg: #F9F8F6; --border: #cbd5e1; }
    body { font-family: "Montserrat", sans-serif; background: var(--bg); margin: 0; padding: 20px; }
    .wrapper { max-width: 1200px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    h1 { color: var(--primary); border-bottom: 2px solid var(--gold); padding-bottom: 10px; }
    .auth-box { background: #EFECE6; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; }
    .auth-box input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--border); }
    .tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; flex-wrap: wrap;}
    .tab-btn { background: #e2e8f0; border: none; padding: 10px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: white; }
    .tab-content { display: none; } .tab-content.active { display: block; }
    
    label { font-weight: bold; display: block; margin-top: 15px; font-size: 14px; color: var(--primary); }
    input[type="text"], textarea { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid var(--border); border-radius: 6px; }
    .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #f8fafc; padding: 15px; border-radius: 8px; margin-top: 10px; }
    .lang-box h4 { margin: 0 0 5px 0; font-size: 13px; display: flex; justify-content: space-between; }
    
    .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; }
    .btn:hover { opacity: 0.9; } .btn-secondary { background: var(--gold); }
    .translate-btn { background: var(--gold); color: white; border: none; padding: 3px 6px; font-size: 11px; border-radius: 4px; cursor: pointer;}
    
    .item-card { background: #fff; border: 1px solid var(--border); padding: 20px; border-radius: 8px; margin-bottom: 20px; position: relative; }
    .remove-btn { background: red; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; position: absolute; top: 10px; right: 10px; }
    .status { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; font-weight: bold;}
    
    .image-preview-area { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;}
    .image-chip { position: relative; width: 80px; height: 80px; border-radius: 6px; border: 1px solid var(--border); overflow: hidden;}
    .image-chip img { width: 100%; height: 100%; object-fit: cover; }
    .hidden-image-input { display: none !important; }
  </style>
</head>
<body>

<div class="wrapper">
  <h1>👑 Interdog Ultimate Admin</h1>
  
  <div class="auth-box">
    <input type="password" id="gh-token" placeholder="Внеси GitHub Token (ghp_...)" />
    <button class="btn" style="margin:0;" onclick="saveToken()">Запомни токен</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('puppies')">🐾 Достапни Кучиња</button>
    <button class="tab-btn" onclick="switchTab('breeds')">🐕 Сите Раси</button>
    <button class="tab-btn" onclick="switchTab('reviews')">👨‍👩‍👧‍👦 Среќни Семејства</button>
    <button class="tab-btn" onclick="switchTab('texts')">⚙️ Текстови на Сајтот (UI)</button>
  </div>

  <!-- PUPPIES -->
  <div id="puppies" class="tab-content active">
    <div id="puppies-container"></div>
    <button class="btn btn-secondary" onclick="addItem('puppies')">+ Додај Куче</button>
    <button class="btn" onclick="saveFile('content/puppies.json', { items: db.puppies }, 'puppies.msg')">Зачувај Кучиња</button>
    <div id="puppies.msg" class="status"></div>
  </div>

  <!-- BREEDS -->
  <div id="breeds" class="tab-content">
    <div id="breeds-container"></div>
    <button class="btn btn-secondary" onclick="addItem('breeds')">+ Додај Раса</button>
    <button class="btn" onclick="saveFile('content/breeds.json', { items: db.breeds }, 'breeds.msg')">Зачувај Раси</button>
    <div id="breeds.msg" class="status"></div>
  </div>

  <!-- REVIEWS -->
  <div id="reviews" class="tab-content">
    <div id="reviews-container"></div>
    <button class="btn btn-secondary" onclick="addItem('reviews')">+ Додај Препорака</button>
    <button class="btn" onclick="saveFile('content/reviews.json', { items: db.reviews }, 'reviews.msg')">Зачувај Препораки</button>
    <div id="reviews.msg" class="status"></div>
  </div>

  <!-- UI TEXTS -->
  <div id="texts" class="tab-content">
    <p>Овде се наоѓа секој текст од сајтот. Внеси го Англискиот текст и кликни "Автоматски преведи сè".</p>
    <button class="btn btn-secondary" onclick="translateAllUI()">🤖 Автоматски преведи сè (од EN)</button>
    <div id="ui-container" style="margin-top: 20px;"></div>
    <button class="btn" style="width:100%;" onclick="saveFile('content/ui.json', db.ui, 'ui.msg')">ЗАЧУВАЈ ГИ СИТЕ ТЕКСТОВИ</button>
    <div id="ui.msg" class="status"></div>
  </div>

</div>

<script>
  const repo = 'JovanLWL/interdog'; 
  let db = { puppies: [], breeds: [], reviews: [], ui: { en: {}, fr: {}, de: {}, es: {} } };

  // Стандардни текстови доколку е празно
  const defaultUIKeys = [
    "top_shipping", "nav_home", "nav_puppies", "nav_breeds", "nav_reviews", "nav_contact",
    "hero_title", "hero_desc", "btn_find", "trust1_title", "trust1_desc", "trust2_title", "trust2_desc",
    "trust3_title", "trust3_desc", "trust4_title", "trust4_desc", "feat1_sub", "feat1_title", "feat1_p1",
    "feat1_l1", "feat1_l2", "feat1_l3", "feat2_sub", "feat2_title", "feat2_p1", "feat2_l1", "feat2_l2",
    "feat3_sub", "feat3_title", "feat3_p1", "feat3_p2", "sec_avail_subtitle", "sec_avail_title", "btn_details",
    "contact_title", "contact_desc"
  ];

  function nl2br(s) { return s ? s.toString().replace(/\n/g, '<br>') : ''; }
  function br2nl(s) { return s ? s.toString().replace(/<br\s*\/?>/gi, '\n') : ''; }

  function saveToken() { localStorage.setItem('gh_token', document.getElementById('gh-token').value.trim()); alert('Зачувано!'); }

  window.addEventListener('DOMContentLoaded', async () => {
    const savedT = localStorage.getItem('gh_token');
    if(savedT) document.getElementById('gh-token').value = savedT;

    const ts = Date.now();
    try { const r = await fetch(`../content/puppies.json?t=${ts}`); if(r.ok) db.puppies = (await r.json()).items || []; } catch(e){}
    try { const r = await fetch(`../content/breeds.json?t=${ts}`); if(r.ok) db.breeds = (await r.json()).items || []; } catch(e){}
    try { const r = await fetch(`../content/reviews.json?t=${ts}`); if(r.ok) db.reviews = (await r.json()).items || []; } catch(e){}
    try { const r = await fetch(`../content/ui.json?t=${ts}`); if(r.ok) db.ui = await r.json(); } catch(e){}

    // Осигурај се дека сите клучеви постојат во UI
    defaultUIKeys.forEach(k => { 
      if(!db.ui.en[k]) db.ui.en[k] = k; 
      ['fr','de','es'].forEach(l => { if(!db.ui[l]) db.ui[l] = {}; if(!db.ui[l][k]) db.ui[l][k] = ''; });
    });

    renderList('puppies'); renderList('breeds'); renderList('reviews'); renderUI();
  });

  function switchTab(tId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tId).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  function renderList(type) {
    const c = document.getElementById(`${type}-container`); c.innerHTML = '';
    db[type].forEach((item, i) => {
      c.innerHTML += `
      <div class="item-card">
        <button class="remove-btn" onclick="db['${type}'].splice(${i},1); renderList('${type}');">X</button>
        <label>Име / Наслов:</label>
        <div class="lang-grid">
          <div class="lang-box"><b>EN</b><input type="text" value="${item.name_en||''}" onchange="db['${type}'][${i}].name_en=this.value"></div>
          <div class="lang-box"><b>FR</b><input type="text" id="${type}_n_fr_${i}" value="${item.name_fr||''}" onchange="db['${type}'][${i}].name_fr=this.value"></div>
          <div class="lang-box"><b>DE</b><input type="text" id="${type}_n_de_${i}" value="${item.name_de||''}" onchange="db['${type}'][${i}].name_de=this.value"></div>
          <div class="lang-box"><b>ES</b><input type="text" id="${type}_n_es_${i}" value="${item.name_es||''}" onchange="db['${type}'][${i}].name_es=this.value"></div>
        </div>
        <button class="translate-btn" onclick="transFields('${type}', ${i}, 'name')">Преведи Име 🤖</button>
        
        <label>Опис:</label>
        <div class="lang-grid">
          <div class="lang-box"><b>EN</b><textarea rows="3" onchange="db['${type}'][${i}].desc_en=nl2br(this.value)">${br2nl(item.desc_en||'')}</textarea></div>
          <div class="lang-box"><b>FR</b><textarea rows="3" id="${type}_d_fr_${i}" onchange="db['${type}'][${i}].desc_fr=nl2br(this.value)">${br2nl(item.desc_fr||'')}</textarea></div>
          <div class="lang-box"><b>DE</b><textarea rows="3" id="${type}_d_de_${i}" onchange="db['${type}'][${i}].desc_de=nl2br(this.value)">${br2nl(item.desc_de||'')}</textarea></div>
          <div class="lang-box"><b>ES</b><textarea rows="3" id="${type}_d_es_${i}" onchange="db['${type}'][${i}].desc_es=nl2br(this.value)">${br2nl(item.desc_es||'')}</textarea></div>
        </div>
        <button class="translate-btn" onclick="transFields('${type}', ${i}, 'desc')">Преведи Опис 🤖</button>

        <label>Слика:</label>
        <input type="text" id="${type}_img_${i}" value="${item.image||''}" class="hidden-image-input">
        <div id="${type}_img_prev_${i}" class="image-preview-area">${item.image ? `<div class="image-chip"><img src="../${item.image}"></div>` : ''}</div>
        <input type="file" accept="image/*" style="margin-top:10px;" onchange="uploadImg(this, '${type}', ${i})">
      </div>`;
    });
  }

  function addItem(type) { db[type].push({ name_en:"", desc_en:"", image:"" }); renderList(type); }

  function renderUI() {
    const c = document.getElementById('ui-container'); c.innerHTML = '';
    Object.keys(db.ui.en).forEach(k => {
      c.innerHTML += `
      <div class="item-card" style="padding:10px;">
        <h4 style="color:#C5A059;">Елемент: ${k}</h4>
        <div class="lang-grid" style="margin-top:5px; padding:10px;">
          <div><b>EN</b><textarea rows="2" onchange="db.ui.en['${k}']=this.value">${db.ui.en[k]}</textarea></div>
          <div><b>FR</b><textarea rows="2" id="ui_fr_${k}" onchange="db.ui.fr['${k}']=this.value">${db.ui.fr[k]||''}</textarea></div>
          <div><b>DE</b><textarea rows="2" id="ui_de_${k}" onchange="db.ui.de['${k}']=this.value">${db.ui.de[k]||''}</textarea></div>
          <div><b>ES</b><textarea rows="2" id="ui_es_${k}" onchange="db.ui.es['${k}']=this.value">${db.ui.es[k]||''}</textarea></div>
        </div>
      </div>`;
    });
  }

  async function translateAllUI() {
    alert("Ова може да потрае 1-2 минути. Не го затворај прозорецот.");
    for (let k of Object.keys(db.ui.en)) {
      const txt = db.ui.en[k]; if(!txt) continue;
      for (let lang of ['fr', 'de', 'es']) {
        if(!db.ui[lang][k]) {
          try {
            const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(txt)}&langpair=en|${lang}&de=sara.dukovska@hotmail.com`);
            const d = await r.json(); if(d.responseData.translatedText) db.ui[lang][k] = d.responseData.translatedText;
          } catch(e){}
        }
      }
    }
    renderUI(); alert("Преводот заврши!");
  }

  async function transFields(type, i, field) {
    const txt = db[type][i][`${field}_en`]; if(!txt) return;
    for (let lang of ['fr', 'de', 'es']) {
      try {
        const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(br2nl(txt))}&langpair=en|${lang}&de=sara.dukovska@hotmail.com`);
        const d = await r.json(); 
        if(d.responseData.translatedText) {
          db[type][i][`${field}_${lang}`] = nl2br(d.responseData.translatedText);
          document.getElementById(`${type}_${field.charAt(0)}_${lang}_${i}`).value = br2nl(d.responseData.translatedText);
        }
      } catch(e){}
    }
  }

  async function uploadImg(fileInput, type, idx) {
    const file = fileInput.files[0]; if(!file) return;
    const token = localStorage.getItem('gh_token'); if(!token) return alert('Внеси токен!');
    const b64 = await new Promise(r => { const rd = new FileReader(); rd.readAsDataURL(file); rd.onload = () => r(rd.result.split(',')[1]); });
    const fName = `content/images/${Date.now()}_${file.name.replace(/\s+/g,'_')}`;
    
    await fetch(`https://api.github.com/repos/${repo}/contents/${fName}`, {
      method: 'PUT', headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `Img upload`, content: b64 })
    });
    db[type][idx].image = fName; renderList(type);
  }

  async function saveFile(path, data, msgId) {
    const token = localStorage.getItem('gh_token'); const el = document.getElementById(msgId);
    if(!token) return alert('Токен!'); el.style.display='block'; el.style.background='#e0f2fe'; el.innerText='⏳ Се зачувува...';
    try {
      const getR = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, { headers: {'Authorization':`token ${token}`} });
      const sha = getR.ok ? (await getR.json()).sha : '';
      const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
      const pR = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
        method: 'PUT', headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: `Update ${path}`, content: b64, sha: sha })
      });
      if(pR.ok) { el.style.background='#dcfce7'; el.innerText='✓ Успешно зачувано! (Види промени за 1 мин)'; }
    } catch(e) { el.style.background='#fee2e2'; el.innerText='✕ Грешка.'; }
  }
</script>
</body>
</html>
